<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="30" height="30">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background (Apple icon shape) -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- Top gloss layer -->
  <rect width="100" height="50" rx="22" fill="url(#shine)"/>
  <!-- Subtle border -->
  <rect width="100" height="100" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>

  <!-- Letter A — SF Pro style, clean and bold -->
  <text
    x="50" y="76"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="68"
    font-weight="600"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="-2"
  >A</text>

  <!-- Apple-style leaf accent -->
  <path d="M60 7 Q68 -2 75 5 Q69 16 59 13 Z" fill="#0066cc" opacity="0.95"/>
  <path d="M63 8 Q69 2 72 7" fill="none" stroke="#0066cc" stroke-width="0.8" stroke-linecap="round"/>
</svg>
